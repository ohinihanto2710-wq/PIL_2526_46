<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Matching — IFRI_MentorLink</title>
  <link rel="stylesheet" href="CSS/style.css"/>
  <link rel="stylesheet" href="CSS/matching.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
</head>
<body>

<nav class="navbar">
  <div class="nav-brand">
    <a href="index.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;">
      <span class="brand-icon">M</span>
      <span class="brand-text">IFRI_<strong>MentorLink</strong></span>
    </a>
  </div>
  <ul class="nav-links">
    <li><a href="index.html">Accueil</a></li>
    <li><a href="matching.html" class="active">Trouver un mentor</a></li>
    <li><a href="discussions.html">Discussions</a></li>
    <li><a href="profil.html">Profil</a></li>
  </ul>
  <div class="nav-actions">
    <a href="login.html" class="btn-ghost">Connexion</a>
    <a href="register.html" class="btn-primary">S'inscrire</a>
  </div>
  <button class="menu-toggle" id="menuToggle">&#9776;</button>
</nav>

<div class="page-hero small-hero">
  <div class="container">
    <h1>Trouver un <span class="accent">mentor</span></h1>
    <p>Notre algorithme analyse compatibilité des compétences, filières et disponibilités.</p>
  </div>
</div>

<section class="section">
  <div class="container matching-layout">

    <!-- FILTERS -->
    <aside class="filters-panel">
      <h3 class="filter-title">Filtres</h3>

      <div class="filter-group">
        <label>Type</label>
        <div class="toggle-group">
          <button class="toggle-btn active" onclick="setType(this,'mentor')">Mentor</button>
          <button class="toggle-btn" onclick="setType(this,'mentoré')">Mentoré</button>
        </div>
      </div>

      <div class="filter-group">
        <label>Matière / Compétence</label>
        <input type="text" class="form-input" id="filterMatiere" placeholder="ex: Python, SQL…"/>
      </div>

      <div class="filter-group">
        <label>Filière</label>
        <select class="form-input" id="filterFiliere">
          <option value="">Toutes</option>
          <option>IA</option><option>GL</option><option>SI</option><option>SE&IoT</option><option>IM</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Niveau</label>
        <select class="form-input" id="filterNiveau">
          <option value="">Tous</option>
          <option>L1</option><option>L2</option><option>L3</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Disponibilité</label>
        <div class="dispo-grid">
          <label class="dispo-item"><input type="checkbox"/> Matin</label>
          <label class="dispo-item"><input type="checkbox"/> Après-midi</label>
          <label class="dispo-item"><input type="checkbox"/> Soir</label>
          <label class="dispo-item"><input type="checkbox"/> Week-end</label>
        </div>
      </div>

      <div class="filter-group">
        <label>Format</label>
        <div class="dispo-grid">
          <label class="dispo-item"><input type="checkbox"/> Présentiel</label>
          <label class="dispo-item"><input type="checkbox"/> En ligne</label>
        </div>
      </div>

      <button class="btn-primary full" onclick="applyFilters()">Rechercher</button>
      <button class="btn-ghost full mt-8" onclick="resetFilters()">Réinitialiser</button>
    </aside>

    <!-- RESULTS -->
    <div class="results-area">
      <div class="results-header">
        <span id="results-count">6 profils trouvés</span>
        <div class="sort-row">
          <label>Trier par</label>
          <select class="form-input small-select" onchange="sortResults(this.value)">
            <option value="score">Score de compatibilité</option>
            <option value="filiere">Filière</option>
            <option value="niveau">Niveau</option>
          </select>
        </div>
      </div>

      <div class="mentor-cards" id="mentorCards">
        <!-- Cards generated by JS -->
      </div>
    </div>
  </div>
</section>

<!-- OFFER/DEMAND MODAL -->
  <div class="modal-overlay" id="offerModal" style="display:none;">
    <div class="modal">
      <button class="modal-close" onclick="closeModal('offerModal')"><i class="fa fa-times"></i></button>
    <h3>Publier une offre / demande</h3>
    <div class="form-msg" id="offerMsg" style="display:none;"></div>
    <div class="form-group">
      <label>Type</label>
      <div class="toggle-group">
        <button class="toggle-btn active" onclick="setPublishType(this,'offre')" id="pub-type-offre">Offre de mentorat</button>
        <button class="toggle-btn" onclick="setPublishType(this,'demande')" id="pub-type-demande">Demande de mentorat</button>
      </div>
    </div>
    <div class="form-group">
      <label>Titre</label>
      <input type="text" id="post-title" class="form-input" placeholder="Ex: Je cherche un mentor en Python..." />
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="post-details" class="form-input" rows="3" placeholder="Décris ton besoin en quelques mots..."></textarea>
    </div>
    <div class="form-group">
      <label>Disponibilités</label>
      <input type="text" id="post-dispo" class="form-input" placeholder="ex: Soir semaine, Week-end" />
    </div>
    <div class="form-group">
      <label>Format</label>
      <select id="post-format" class="form-input">
        <option>Présentiel</option><option>En ligne</option><option>Les deux</option>
      </select>
    </div>
    <button class="btn-primary full" onclick="publishOfferOrDemand()">Publier</button>
  </div>
</div>

<div class="fab-area">
  <button class="fab" onclick="document.getElementById('offerModal').style.display='flex'" title="Publier une offre ou une demande"><i class="fa fa-plus"></i> Publier</button>
</div>

<script src="app.js"></script>
</body>
</html>
