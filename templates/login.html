{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion — IFRI_MentorLink</title>
  <link rel="stylesheet" href="{% static 'style.css' %}"/>
  <link rel="stylesheet" href="{% static 'Login.css' %}"/>
  <link rel="stylesheet" href="https://cloudflare.com"/>
  <link href="https://googleapis.com" rel="stylesheet"/>
</head>
<body class="auth-page">

<div class="auth-split">
  <!-- Left Panel -->
  <div class="auth-left">
    <a href="/" class="auth-brand">
      <span class="brand-icon">M</span>
      <span>IFRI_<strong>MentorLink</strong></span>
    </a>
    <div class="auth-visual">
      <div class="av-card">
        <div class="av-orb av-o1"></div>
        <div class="av-orb av-o2"></div>
        <div class="av-quote">
          <p>"Le savoir partagé est le savoir multiplié."</p>
        </div>
        <div class="av-stats-row">
          <div class="av-stat"><span>IA</span><small>Filière</small></div>
          <div class="av-stat"><span>GL</span><small>Filière</small></div>
          <div class="av-stat"><span>SI</span><small>Filière</small></div>
          <div class="av-stat"><span>SE</span><small>Filière</small></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="auth-right">
    <div class="auth-form-wrap">
      <h2 class="auth-title">Connexion</h2>
      <p class="auth-sub">Connecte-toi pour accéder à ta communauté de mentors.</p>

      <div class="form-msg" id="loginMsg" style="display:none;"></div>

      <div class="form-group">
        <label>Email ou téléphone</label>
        <input type="text" id="email" placeholder="ex: kokou@ifri.uac.bj" class="form-input"/>
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <div class="input-eye">
          <input type="password" id="password" placeholder="••••••••" class="form-input"/>
        </div>
      </div>
      <div class="form-row-between">
        <label class="checkbox-label"><input type="checkbox"/> Se souvenir de moi</label>
        <a href="#" class="link-small">Mot de passe oublié ?</a>
      </div>
      <!-- 🚨 Utilisation de la fonction connexion(event) liée à app.js -->
      <button class="btn-primary full" onclick="connexion(event)">Se connecter</button>
      <!-- 🚨 Redirection sémantique corrigée pour Render -->
      <p class="auth-switch">Pas encore de compte ? <a href="/register/">S'inscrire</a></p>
    </div>
  </div>
</div>

<script src="{% static 'app.js' %}"></script>
</body>
</html>
