{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion — IFRI_MentorLink</title>
  <link rel="stylesheet" href="{% static 'style.css' %}"/>
  <link rel="stylesheet" href="{% static 'Login.css' %}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
</head>
<body class="auth-page">

<div class="auth-split">
  <!-- Left Panel -->
  <div class="auth-left">
    <a href="index.html" class="auth-brand">
      <span class="brand-icon">M</span>
      <span>IFRI_<strong>MentorLink</strong></span>
    </a>
    <div class="auth-visual">
      <div class="av-card">
        <div class="av-orb av-o1"></div>
        <div class="av-orb av-o2"></div>
        <div class="av-quote">
          <p>"Le savoir partagé est le savoir multiplié."</p>
        </div>
        <div class="av-stats-row">
          <div class="av-stat"><span>IA</span><small>Filière</small></div>
          <div class="av-stat"><span>GL</span><small>Filière</small></div>
          <div class="av-stat"><span>SI</span><small>Filière</small></div>
          <div class="av-stat"><span>SE</span><small>Filière</small></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="auth-right">
    <div class="auth-form-wrap">
      <h2 class="auth-title"></h2>
      <p class="auth-sub">Connecte-toi pour accéder à ta communauté de mentors.</p>

      <div class="form-msg" id="loginMsg" style="display:none;"></div>

      <div class="form-group">
        <label>Email ou téléphone</label>
        <input type="text" id="loginId" placeholder="ex: kokou@ifri.uac.bj" class="form-input"/>
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <div class="input-eye">
          <input type="password" id="loginPwd" placeholder="••••••••" class="form-input"/>
          <button type="button" class="eye-btn" onclick="togglePwd('loginPwd', this)"><i class="fa fa-eye"></i></button>
        </div>
      </div>
      <div class="form-row-between">
        <label class="checkbox-label"><input type="checkbox"/> Se souvenir de moi</label>
        <a href="#" class="link-small">Mot de passe oublié ?</a>
      </div>
      <button class="btn-primary full" onclick="handleLogin()">Se connecter</button>
      <p class="auth-switch">Pas encore de compte ? <a href="register.html">S'inscrire</a></p>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
