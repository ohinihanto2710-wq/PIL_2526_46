{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inscription — IFRI_MentorLink</title>
  <link rel="stylesheet" href="{% static 'style.css' %}"/>
  <link rel="stylesheet" href="{% static 'register.css' %}"/>
  <link rel="stylesheet" href="https://cloudflare.com"/>
  <link href="https://googleapis.com" rel="stylesheet"/>
</head>
<body class="auth-page">

<div class="auth-split">
  <div class="auth-left">
    <a href="/" class="auth-brand">
      <span class="brand-icon">M</span>
      <span>IFRI_<strong>MentorLink</strong></span>
    </a>
  </div>

  <div class="auth-right">
    <div class="auth-form-wrap">
      <h2 class="auth-title">Créer un compte</h2>
      <p class="auth-sub">Rejoins la communauté d'entraide de l'IFRI.</p>

      <form id="form-inscription" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label for="nom">Nom complet</label>
          <!-- 🚨 L'id="nom" a été rajouté ici -->
          <input type="text" id="nom" required placeholder="Ex: Jean Doe" class="form-input"/>
        </div>

        <div class="form-group">
          <label for="email">Adresse Email</label>
          <!-- 🚨 L'id="email" a été rajouté ici -->
          <input type="email" id="email" required placeholder="Ex: jean.doe@email.com" class="form-input"/>
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <!-- 🚨 L'id="password" a été rajouté ici -->
          <input type="password" id="password" required placeholder="Votre mot de passe" class="form-input"/>
        </div>

        <div class="form-group">
          <label for="role">Vous êtes :</label>
          <!-- 🚨 L'id="role" a été rajouté ici -->
          <select id="role" required class="form-input">
            <option value="mentore">Mentoré (Élève)</option>
            <option value="mentor">Mentor (Guide)</option>
            <option value="les_deux">Les deux (Mentor & Mentoré)</option>
          </select>
        </div>

        <!-- 🚨 Appel forcé de la fonction avec onclick -->
        <button type="button" class="btn-primary full" onclick="inscription(event)">S'inscrire</button>
      </form>

      <p class="auth-switch">Déjà inscrit ? <a href="/">Se connecter</a></p>
    </div>
  </div>
</div>
<script src="{% static 'app.js' %}"></script>
</body>
</html>
